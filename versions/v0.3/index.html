<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>라인 연결 퍼즐</title>
  <link rel="stylesheet" href="styles.css?v=v0-3-candidate-release">
</head>
<body>
  <main class="game-shell" id="gameScreen">
    <header class="header">
      <button class="home-button" id="homeButton" type="button" aria-label="홈으로 이동" title="HOME">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 23 24 8l18 15v18a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/><path d="M18 44V29h12v15"/></svg>
      </button>
      <div class="stage-badge" id="stageLabel"><span class="stage-text">STAGE <span class="stage-number">01</span></span></div>
      <button class="restart-button" id="restartButton" type="button" aria-label="현재 스테이지 다시 시작" title="RESTART">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 22a15 15 0 1 0 7-11"/><path class="restart-arrow" d="M8 11 24 2v18z"/></svg>
      </button>
    </header>
    <section class="game-content" aria-label="라인 연결 퍼즐">
      <div class="board-stack">
        <div class="board-frame" id="boardFrame">
          <div class="board" id="board" role="grid" aria-label="퍼즐 보드"></div>
          <div class="start-overlay" id="startOverlay" aria-live="assertive">START</div>
        </div>
      </div>
    </section>
    <footer class="move-status" aria-label="현재 Move">
      <article class="move-card" id="moveCard" data-grade="perfect">
        <h2 id="moveGradeLabel">PERFECT MOVES</h2>
        <p><span class="move-used" id="moveUsed">00</span><span class="move-slash">/</span><span class="move-target" id="moveTarget">00</span></p>
      </article>
    </footer>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card"><p class="modal-kicker" id="modalKicker">PERFECT</p><h1 id="modalTitle">PERFECT!</h1><p id="modalText"></p><button class="modal-button" id="modalButton" type="button">NEXT STAGE</button></div>
    </div>
  </main>
  <section class="home-screen" id="homeScreen" aria-label="Stage home">
    <header class="home-header"><button class="reset-progress-button" id="resetProgressButton" type="button">RESET</button><button class="admin-mode-button" id="adminModeButton" type="button">ADMIN</button><h1>STAGES</h1><p>YOUR PATH</p></header>
    <div class="stage-list" id="homeStageList"></div>
    <div class="reset-modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><div class="reset-card"><h2 id="resetTitle">RESET STAGES?</h2><p>모든 스테이지 정보가 초기화 됩니다.<br>초기화 하시겠습니까?</p><div><button id="resetNoButton" type="button">NO</button><button id="resetYesButton" type="button">YES</button></div></div></div>
  </section>
  <script src="game.js?v=v0-3-late-stage-dispersed"></script>
</body>
</html>
