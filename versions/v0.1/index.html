<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>라인 연결 퍼즐</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="header"><div class="stage-badge" id="stageLabel">STAGE 01/06</div></header>
    <section class="game-content" aria-label="라인 연결 퍼즐">
      <div class="board-frame" id="boardFrame">
        <div class="board" id="board" role="grid" aria-label="퍼즐 보드"></div>
        <div class="start-overlay" id="startOverlay" aria-live="assertive">START</div>
      </div>
      <section class="move-gauge" id="moveGauge" aria-label="Move 게이지"></section>
    </section>
    <footer class="stats" aria-label="게임 정보"><article class="stat-card"><h2>Time</h2><p id="timeValue">00:00</p></article></footer>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card"><p class="modal-kicker" id="modalKicker">PERFECT</p><h1 id="modalTitle">PERFECT!</h1><p id="modalText"></p><button class="modal-button" id="modalButton" type="button">NEXT STAGE</button></div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
