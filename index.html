<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>라인 연결 퍼즐</title>
  <link rel="stylesheet" href="styles.css?v=v0-7-level-hud-2">
  <link rel="stylesheet" href="stage-select.css?v=v0-7-level-ranges-1">
  <link rel="stylesheet" href="stage-select-fix.css?v=v0-4-pipe-network-reset-2">
  <link rel="stylesheet" href="episode.css?v=v0-4-level-anchor-font-1">
</head>
<body>
  <main class="game-shell" id="gameScreen">
    <header class="header">
      <button class="home-button" id="homeButton" type="button" aria-label="홈으로 이동" title="HOME">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 23 24 8l18 15v18a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/><path d="M18 44V29h12v15"/></svg>
      </button>
      <button class="restart-button" id="restartButton" type="button" aria-label="현재 레벨 다시 시작" title="RESTART">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 22a15 15 0 1 0 7-11"/><path class="restart-arrow" d="M8 11 24 2v18z"/></svg>
      </button>
    </header>
    <div class="stage-badge" id="stageLabel"><span class="stage-text">LEVEL <span class="stage-number">01</span></span></div>
    <section class="game-content" aria-label="라인 연결 퍼즐">
      <div class="board-stack">
        <div class="board-frame" id="boardFrame">
          <div class="board" id="board" role="grid" aria-label="퍼즐 보드"></div>
          <div class="start-overlay" id="startOverlay" aria-live="assertive">START</div>
        </div>
      </div>
    </section>
    <footer class="move-status" aria-label="현재 Move">
      <article class="move-card" id="moveCard" data-grade="perfect">
        <h2 id="moveGradeLabel">PERFECT MOVES</h2>
        <p><span class="move-used" id="moveUsed">00</span><span class="move-slash">/</span><span class="move-target" id="moveTarget">00</span></p>
      </article>
    </footer>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card"><p class="modal-kicker" id="modalKicker">PERFECT</p><h1 id="modalTitle">PERFECT!</h1><div class="modal-stars" id="modalStars" aria-label="획득 별"></div><p id="modalText"></p><button class="modal-button" id="modalButton" type="button">NEXT LEVEL</button></div>
    </div>
  </main>
  <section class="home-screen" id="homeScreen" aria-label="Level selection">
    <header class="home-header"><button class="episode-nav episode-prev" id="episodePrevButton" type="button" aria-label="Previous levels"><img src="assets/stage_btn_next_arrow.png" alt=""></button><h1 id="episodeTitle"><span class="stage-title-word">LEVEL</span><strong class="stage-title-number">01-20</strong></h1><button class="episode-nav episode-next" id="episodeNextButton" type="button" aria-label="Next levels"><img src="assets/stage_btn_next_arrow.png" alt=""></button></header>
    <div class="stage-list" id="homeStageList"></div>
    <nav class="home-tools" aria-label="Stage tools"><button class="reset-progress-button" id="resetProgressButton" type="button">RESET</button><button class="admin-mode-button" id="adminModeButton" type="button">ADMIN</button><button class="design-test-button" id="designTestButton" type="button">BLOCK DESIGN</button><button class="stage-test-button" id="stageTestButton" type="button">STAGE TEST</button></nav>
    <div class="reset-modal" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetTitle"><div class="reset-card"><h2 id="resetTitle">RESET STAGES?</h2><p>모든 스테이지 정보가 초기화 됩니다.<br>초기화 하시겠습니까?</p><div><button id="resetNoButton" type="button">NO</button><button id="resetYesButton" type="button">YES</button></div></div></div>
  </section>
  <section class="design-screen" id="designScreen" aria-label="Block design preview">
    <header class="design-header"><button class="design-back-button" id="designBackButton" type="button" aria-label="Back to stages">BACK</button><h1>BLOCK DESIGN</h1></header>
    <main class="design-content" id="designContent"></main>
  </section>
  <section class="stage-test-screen" id="stageTestScreen" aria-label="Board size stage tests">
    <header class="stage-test-header"><button class="stage-test-back-button" id="stageTestBackButton" type="button">BACK</button><h1>STAGE TEST</h1><p>SELECT BOARD SIZE</p></header>
    <main class="stage-test-content" id="stageTestContent"></main>
  </section>
  <script src="game.js?v=v0-7-level-53-network-1"></script>
</body>
</html>
